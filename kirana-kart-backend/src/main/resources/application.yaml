spring:
  application:
    name: Kirana Kart
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        ddl-auto: update
        types:
          print:
            banner: false
        temp:
          use_jdbc_metadata_defaults: false
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:postgresql://localhost:5432/kirana-kart
    username: postgres
    password: 129109
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: HikariPool-1
      max-lifetime: 1800000
      connection-timeout: 20000
  liquibase:
    change-log: classpath:db/db.changelog-master.yaml
  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: XRTFH7Y59N28IfItawsFBAu9hl9LNW2T
            client-secret: tq1FGc5dKQ2W6b_D2jW83VFExZcmC1EQ4qlAI8Ga3WkDM8bjx9z0Et97z9vaw_d2
            scope: openid,profile,email
            redirect-uri: "http://localhost:3000/login/oauth2/code/auth0"
            authorization-grant-type: authorization_code
            client-name: Auth0
        provider:
          auth0:
            issuer-uri: https://dev-bhojkart.jp.auth0.com/

server:
  port: 3000

jwt:
  secret: tq1FGc5dKQ2W6b_D2jW83VFExZcmC1EQ4qlAI8Ga3WkDM8bjx9z0Et97z9vaw_d2
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 10MB

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized